
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f1f5f9">

    <title>Sign In | InvoicePro</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}?v=3"
    >
</head>

<body>

<div class="login-wrapper">

    <div class="login-card">

        <!-- Brand Section -->
        <section class="brand-section">

            <div class="brand-icon">I</div>

            <h1>InvoicePro</h1>

            <p>Smart Invoicing. Simple Business.</p>

            <div class="brand-divider"></div>

            <span class="brand-caption">
                Simplify your business finances with confidence.
            </span>

        </section>


        <!-- Login Form Section -->
        <main class="form-section">

            <div class="form-heading">
                <span class="welcome-label">WELCOME BACK</span>

                <h2>Welcome Back!</h2>

                <p class="subtitle">
                    Sign in to manage your business.
                </p>
            </div>

            <div
                id="message"
                class="alert d-none"
                role="alert"
            ></div>


            <form id="loginForm">

                <div class="form-group">
                    <label for="email" class="form-label">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>


                <div class="form-group password-group">
                    <label for="password" class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>


                <button
                    type="submit"
                    id="loginButton"
                    class="btn login-btn w-100"
                >
                    <span>Sign In</span>
                    <span class="button-arrow" aria-hidden="true">→</span>
                </button>

            </form>


            <!-- Signup Section -->
            <div class="auth-switch-section">

                <p class="auth-switch-text">
                    New to InvoicePro?
                </p>

                <a href="/register/" class="signup-link">
                    Create an account
                    <span aria-hidden="true">→</span>
                </a>

            </div>


            <!-- Footer -->
            <div class="login-footer">
                <span class="footer-indicator"></span>
                Secure Business Management Platform
            </div>

        </main>

    </div>

</div>


<script src="{% static 'js/login.js' %}?v=2"></script>

</body>
</html>
